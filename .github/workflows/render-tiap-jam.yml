name: Render video (cek tiap jam)
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"   # tiap jam, menit ke-7
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: python3 render.py
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ vars.VOICE_ID }}
      - name: Simpan video & hasil ke repo
        if: always()
        run: |
          git config user.name "render-bot"; git config user.email "bot@users.noreply.github.com"
          git add output/*.mp4 output/hasil.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Video baru" && git pull --rebase && git push)
